[package]
name = "gdxtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Reusable xtask toolkit for Godot + Rust (gdext) projects"
publish = false

[features]
default = ["process"]
process = []
files = ["dep:windows-sys"]
isolation = []
cli = ["dep:clap"]
godot = ["process", "dep:serde_json", "dep:which"]
addons = ["godot", "dep:serde_json", "dep:ureq", "dep:zip"]
gdext = ["process", "dep:serde_json", "dep:toml_edit", "dep:ureq"]
run-export = ["process", "godot", "cli"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["preserve_order"], optional = true }
tempfile = "3"
toml_edit = { version = "0.22", optional = true }
ureq = { version = "2", features = ["json"], optional = true }
zip = { version = "2", optional = true }
which = { version = "8", optional = true }

[[example]]
name = "full"
required-features = ["cli", "addons", "gdext", "run-export"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
